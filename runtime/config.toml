# Managed Codex-base defaults for codex-cli 0.146.0-alpha.3.1.
# Model, reasoning effort and providers remain user-owned.
project_doc_max_bytes = 8192
check_for_update_on_startup = false

[features]
hooks = true

[agents]
enabled = true

[mcp_servers.k7-revit-bridge]
command = "k7-revit-bridge.exe"

[mcp_servers.k7-autocad-bridge]
command = "k7-autocad-bridge.exe"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true
